<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090E1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TRAFFIX" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>TRAFFIX — Intelligent Traffic Management & Route Optimization</title>
    <meta
      name="description"
      content="Full-stack smart-city traffic operations platform with multi-factor route optimization, intelligent incident detection, 15-30 minute congestion prediction, adaptive signal simulation, and emergency priority routing."
    />
    <meta property="og:title" content="TRAFFIX — Intelligent Traffic Management & Route Optimization" />
    <meta
      property="og:description"
      content="Smart-city traffic operations platform with Dijkstra/A* routing, duplicate incident detection, congestion forecasting, and adaptive signal simulation."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('traffix_theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#090E1A] dark:text-slate-100 antialiased selection:bg-blue-500/30 selection:text-blue-900 dark:selection:text-blue-100 transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
